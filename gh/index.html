<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6c5ce7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小说笔记">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-180.png">
<link rel="icon" href="icon-192.png">
<title>小说笔记工作台 · GitHub 版 · v1.4.0</title>
<style>
:root{
  --bg:#f5f5fa; --card:#fff; --line:#e6e4f0; --ink:#241f33; --ink2:#8a879e;
  --acc:#6c5ce7; --acc2:#5546d6; --danger:#e04a4f;
  --c-person:#e17055; --c-clue:#0984e3; --c-time:#00b894; --c-place:#e84393;
  --c-quote:#fdcb6e; --c-q:#a29bfe; --c-other:#b2bec3;
  --radius:14px; --shadow:0 4px 18px rgba(40,30,80,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  padding-bottom:calc(20px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ===== 顶栏 ===== */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:10px 12px calc(10px);background:rgba(245,245,250,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{width:38px;height:38px;border-radius:11px;flex:none;background:linear-gradient(135deg,#6c5ce7,#a29bfe);
  color:#fff;font-size:18px;font-weight:700;display:grid;place-items:center}
.brand-wrap{min-width:0}
.brand-t{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-s{font-size:11.5px;color:var(--ink2)}
.top-ops{display:flex;gap:2px}
.icon-btn{border:0;background:transparent;color:var(--ink2);width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center}
.icon-btn svg{width:21px;height:21px}
.icon-btn:active{background:#eceafd;color:var(--acc)}

/* ===== 搜索 ===== */
.searchwrap{padding:10px 12px 0}
.search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:0 12px;box-shadow:var(--shadow)}
.search-box svg{width:18px;height:18px;color:var(--ink2);flex:none}
.search-box input{flex:1;border:0;outline:0;background:none;padding:11px 0;font-size:14.5px}

/* ===== 分类条 ===== */
.cats{display:flex;gap:7px;overflow-x:auto;padding:12px 12px 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink2);
  border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600}
.cat-chip.on{color:#fff;border-color:transparent}
.cat-chip .n{opacity:.7;font-weight:400;margin-left:3px;font-size:11.5px}

/* ===== 卡片墙 ===== */
.wall{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
@media(max-width:560px){.wall{grid-template-columns:1fr 1fr;gap:9px;padding:9px}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  border-top:4px solid var(--c-other);padding:11px 12px 12px;display:flex;flex-direction:column;gap:7px;
  position:relative;transition:transform .12s}
.card:active{transform:scale(.985)}
.card .c-head{display:flex;align-items:flex-start;gap:6px}
.card .c-title{font-size:14.5px;font-weight:700;flex:1;min-width:0;word-break:break-word}
.card .c-cat{font-size:10.5px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px;flex:none;margin-top:1px}
.card .c-body{font-size:12.8px;color:#55516b;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;
  white-space:pre-wrap;word-break:break-word}
.card .c-imgs{display:flex;gap:5px;overflow:hidden}
.card .c-imgs img{width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none}
.card .c-foot{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);margin-top:auto;padding-top:4px}
.card .c-links{font-size:11px;color:var(--acc);font-weight:600}
.card .c-pin{position:absolute;top:-9px;right:8px;font-size:15px}
.wall-empty{grid-column:1/-1;text-align:center;color:var(--ink2);padding:56px 20px;font-size:13.5px;line-height:2}
.wall-empty b{display:block;font-size:15px;color:var(--ink)}

/* ===== 人物关系视图 ===== */
.graph{padding:16px 12px;overflow:auto}
.g-svg{width:100%;min-height:60vh}
.g-tip{font-size:12px;color:var(--ink2);margin:0 4px 10px}

/* ===== 时间线看板（手动拖拽） ===== */
.timeline{padding:12px 0 20px}
.tl-tip{font-size:12px;color:var(--ink2);margin:0 14px 10px;line-height:1.7}
.kb-scroll{overflow-x:auto;padding:4px 14px 16px;-webkit-overflow-scrolling:touch}
.kb-track{display:flex;align-items:stretch;width:max-content;min-height:56vh;gap:12px}
.kb-lane{width:262px;flex:none;display:flex;flex-direction:column;background:#eeeafb;
  border:1px solid #e2def5;border-radius:16px;padding:10px}
.kb-lane[data-lane="__pool__"]{background:#f2f1f7;border-style:dashed;border-color:#d8d4e8}
.kb-lane-h{display:flex;align-items:center;gap:6px;margin-bottom:9px;min-height:30px}
.kb-title{font-size:13.5px;font-weight:800;color:var(--ink);cursor:text;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-title .n{color:var(--ink2);font-weight:400;font-size:11.5px}
.kb-lane-ops{margin-left:auto;display:flex;gap:2px}
.kb-lane-ops button{border:0;background:#e3dff5;color:#7c72b8;border-radius:7px;width:26px;height:26px;
  font-size:13px;font-weight:700;display:grid;place-items:center;padding:0}
.kb-lane-ops button:active{background:#d3cdf0;color:var(--acc)}
.kb-drop{flex:1;display:flex;flex-direction:column;gap:9px;min-height:80px;border-radius:12px;
  border:2px dashed transparent;padding:2px;transition:border-color .15s,background .15s}
.kb-drop.over{border-color:var(--acc);background:rgba(108,92,231,.07)}
.kb-card{cursor:grab}
.kb-card.dragging{opacity:.45;transform:scale(.97)}
.kb-card .c-body{-webkit-line-clamp:3!important}
.kb-empty{border:2px dashed #d5d0ea;border-radius:12px;padding:22px 10px;text-align:center;
  color:#b0aacb;font-size:12.5px}
.kb-addlane{width:64px;flex:none;border:2px dashed #cfcae6;border-radius:16px;color:#8f88b8;
  display:grid;place-items:center;text-align:center;font-size:13px;font-weight:700;line-height:1.6;cursor:pointer}
.kb-addlane:active{background:#eceaF6;color:var(--acc)}
@media(max-width:560px){.kb-lane{width:230px}}

/* ===== FAB ===== */
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:20;
  width:56px;height:56px;border-radius:18px;border:0;color:#fff;
  background:linear-gradient(135deg,var(--acc),#a29bfe);box-shadow:0 8px 22px rgba(108,92,231,.42);
  display:grid;place-items:center}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.94)}

/* ===== 抽屉（书本）===== */
.drawer-backdrop,.sheet-backdrop{position:fixed;inset:0;z-index:30;background:rgba(20,15,40,.42)}
.drawer{position:fixed;z-index:31;top:0;left:0;bottom:0;width:min(320px,84vw);background:var(--bg);
  display:flex;flex-direction:column;box-shadow:8px 0 30px rgba(0,0,0,.15)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 10px}
.drawer-h b{font-size:15.5px}
.mini-btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--ink)}
.mini-btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.drawer-list{flex:1;overflow-y:auto;padding:4px 10px 20px}
.book-item{background:var(--card);border-radius:12px;padding:12px 13px;margin-bottom:8px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;position:relative}
.book-item.on{outline:2px solid var(--acc)}
.book-item .b-em{font-size:20px}
.book-item .b-n{font-weight:700;font-size:14px}
.book-item .b-s{font-size:11.5px;color:var(--ink2)}
.book-item .b-del{border:0;background:none;color:#c9c6d8;font-size:16px;padding:6px}

/* ===== 弹层 ===== */
.sheet{position:fixed;z-index:31;left:50%;bottom:0;transform:translateX(-50%);
  width:min(640px,100vw);max-height:92vh;overflow-y:auto;background:var(--bg);
  border-radius:22px 22px 0 0;padding:10px 14px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet .grab{width:42px;height:4px;border-radius:2px;background:#d8d5e8;margin:4px auto 12px}
.sheet h3{margin:0 0 12px;font-size:16px}

/* 电脑端：弹层改成居中窗口，并可拖动（抓标题栏或顶部小横条） */
@media (min-width:760px){
  .sheet{top:46%;left:50%;bottom:auto;transform:translate(-50%,-50%);
    width:min(560px,94vw);max-height:84vh;border-radius:16px;padding:14px 18px 18px;
    box-shadow:0 24px 60px rgba(20,15,40,.28);border:1px solid var(--line)}
  .sheet .grab{width:56px;background:#c9c6d8;cursor:grab;margin:2px auto 10px}
  .sheet h3{cursor:grab;user-select:none;display:flex;align-items:center;gap:8px}
  .sheet.dragging,.sheet.dragging h3,.sheet.dragging .grab{cursor:grabbing}
  .sheet.dragging{transition:none}
  .sheet h3::after{content:"拖动我可移动 · 双击回正";font-size:11px;font-weight:400;color:var(--ink2);margin-left:auto;white-space:nowrap}
}
.f-row{margin-bottom:11px}
.f-row label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.f-row input[type=text],.f-row textarea,.f-row select{width:100%;border:1px solid var(--line);border-radius:11px;
  background:var(--card);padding:11px 12px;font-size:14px;font-family:inherit;outline:0}
.f-row textarea{min-height:150px;resize:vertical;line-height:1.65}
.f-row textarea:focus,.f-row input:focus{border-color:var(--acc)}
.f-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-picks{display:flex;gap:7px;flex-wrap:wrap}
.cat-pick{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.cat-pick.on{color:#fff;border-color:transparent}
.link-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.link-chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;font-size:12px}
.link-chip b{font-weight:700}
.link-chip .x{color:#c9c6d8;font-weight:700}
/* 关联 + 关系备注 */
.link-box{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.link-row{display:flex;flex-direction:column;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.link-row .link-chip{align-self:flex-start}
.link-note{width:100%;border:1px dashed var(--line);background:transparent;border-radius:9px;padding:7px 9px;
  font-size:12.5px;color:var(--ink)}
.link-note:focus{outline:none;border-color:var(--acc);border-style:solid}
/* 存储方式选择 */
.mode-box{display:flex;gap:9px;margin-top:8px}
.mode-card{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--line);
  background:var(--card);border-radius:14px;padding:12px 8px}
.mode-card.on{border-color:var(--acc);background:#f2efff;box-shadow:0 0 0 2px rgba(108,92,231,.12)}
.mode-card .mc-em{font-size:22px}
.mode-card .mc-t{font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.mode-card .mc-t small{font-size:11px;font-weight:400;color:var(--ink2);line-height:1.4}
.img-pre{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.img-pre .im{position:relative}
.img-pre img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.img-pre .del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;
  background:#333;color:#fff;font-size:11px;display:grid;place-items:center}
.paste-hint{font-size:11.5px;color:var(--ink2);margin-top:6px}
.sheet-ops{display:flex;gap:9px;margin-top:14px}
.sheet-ops button{flex:1;border:0;border-radius:12px;padding:13px;font-size:14.5px;font-weight:700}
.btn-save{background:var(--acc);color:#fff}
.btn-del{background:#fdeaea;color:var(--danger);flex:0 0 52px!important}
.btn-ghost{background:#eceaF6;color:var(--ink)}
.img-big{width:100%;border-radius:12px;margin-top:6px}

/* 关系编辑选择列表 */
.pick-list{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.pick-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.pick-item:last-child{border-bottom:0}
.pick-item .dot{width:9px;height:9px;border-radius:50%;flex:none}
.pick-item .nm{flex:1;font-weight:600}
.pick-item button{border:0;background:#eceaF6;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--acc)}
.pick-item button.rm{color:var(--danger)}

/* 详情页 */
.d-cat{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.d-body{white-space:pre-wrap;font-size:14px;line-height:1.75;color:#3c3854;word-break:break-word}
.d-sec{font-size:12px;font-weight:700;color:var(--ink2);margin:16px 0 7px;display:flex;align-items:center;gap:6px}
.d-links{display:flex;flex-direction:column;gap:6px}
.d-link{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:9px 12px;font-size:13px}
.d-link .dot{width:9px;height:9px;border-radius:50%;flex:none}
.d-link .go{margin-left:auto;color:var(--acc);font-weight:700;font-size:12px;border:0;background:none}
.d-note{margin-left:6px;background:#f4f1ff;border-radius:7px;padding:2px 7px;font-size:11.5px;color:#5a4fa8;font-weight:600;
  max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 菜单弹层 */
.menu-list{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.menu-item{display:flex;align-items:center;gap:10px;border:0;background:none;padding:13px 8px;
  font-size:14px;font-weight:600;color:var(--ink);border-radius:10px;text-align:left}
.menu-item:active{background:#eceaF6}
.menu-item .mi-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:#eceaF6}
.menu-item small{display:block;font-weight:400;color:var(--ink2);font-size:11.5px}
.token-box{background:var(--card);border:1px dashed var(--acc);border-radius:11px;padding:12px;text-align:center;
  font-size:13px;margin:8px 0 12px}
.token-box b{font-size:22px;letter-spacing:6px;color:var(--acc);display:block;margin-top:4px}

/* toast */
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#2c2840;color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;
  box-shadow:0 6px 18px rgba(0,0,0,.25);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* 离线提示条 & 只读态 */
.offline-bar{position:sticky;top:58px;z-index:19;background:#fff3cd;color:#8a6d00;
  font-size:12.5px;font-weight:700;text-align:center;padding:7px 12px;border-bottom:1px solid #f1e3a0}
body.is-offline .fab{filter:grayscale(1);opacity:.55}

/* 版本行（菜单底部） */
.ver-line{text-align:center;font-size:11.5px;color:var(--ink2);margin:2px 0 10px;letter-spacing:.3px}
</style>
</head>
<body>
<header class="top">
  <button class="icon-btn" id="btnBooks" title="切换书本">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
  <div class="brand">
    <div class="mark" id="brandMark">笔</div>
    <div class="brand-wrap">
      <div class="brand-t" id="bookTitle">未选择书本</div>
      <div class="brand-s" id="bookSub">0 张卡片</div>
    </div>
  </div>
  <div class="top-ops">
    <button class="icon-btn" id="btnView" title="视图：卡片墙 / 人物关系">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7.3 10.8 16.7 6.2M7.3 13.2l9.4 4.6"/></svg>
    </button>
    <button class="icon-btn" id="btnSearch" title="搜索">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button class="icon-btn" id="btnMenu" title="设置与备份">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </button>
  </div>
</header>

<div class="offline-bar hidden" id="offlineBar">📴 离线模式：正在查看本地缓存（只读），联网后自动恢复</div>
<div class="searchwrap hidden" id="searchWrap">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="searchInput" placeholder="搜索卡片标题 / 内容 / 标签">
  </div>
</div>

<nav class="cats" id="catBar"></nav>
<main id="main">
  <div id="wall" class="wall"></div>
  <div id="timeline" class="timeline hidden"></div>
  <div id="graph" class="graph hidden"></div>
</main>

<button class="fab" id="fab" aria-label="新建卡片">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="drawer-backdrop hidden" id="drawerBackdrop"></div>
<aside class="drawer hidden" id="bookDrawer">
  <div class="drawer-h">
    <b>我的书架</b>
    <button class="mini-btn primary" id="btnNewBook">＋ 新建书本</button>
  </div>
  <div class="drawer-list" id="bookList"></div>
</aside>

<div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
<div class="sheet hidden" id="sheet"></div>
<div class="toast-wrap" id="toastWrap"></div>
<input type="file" id="filePick" accept="image/*" multiple class="hidden">

<script>
/* 小说笔记工作台 · GitHub 存储层 */
"use strict";

/* 数据结构（仓库内）:
 *   data/notes.json        全部数据（可加密，AES-GCM）
 *   images/<hash>.bin      图片（可加密，扩展名固定 .bin，实际为 png/webp 等）
 * 配置存于 localStorage: gh_cfg = { owner, repo, token, enc(bool), }
 * 加密密码不落盘，每次会话输入一次（存 sessionStorage）
 */
var Store = (function () {
  var API = "https://api.github.com";
  var cfg = null;
  var cryptoKey = null;      // CryptoKey，会话内缓存
  var imgCache = {};         // key -> objectURL
  var stateCache = null;
  var lastSyncSha = null;    // notes.json 的 blob sha
  var lastSyncVersion = 0;

  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

  var LS_LOCAL = "nn_local_state";
  function loadCfg() { cfg = lsGet("gh_cfg", null); return cfg; }
  function saveCfg(c) { cfg = c; lsSet("gh_cfg", c); }
  /* 本机模式：数据只存浏览器 localStorage，不联网、不需要 Token 和密码 */
  function isLocal() { return !!(cfg && cfg.local); }
  function useLocal() { cfg = { local: true, owner: "", repo: "", token: "", enc: false }; lsSet("gh_cfg", cfg); return cfg; }

  /* ---------- 基础请求 ---------- */
  function ghReq(method, path, body, raw) {
    var headers = {
      "Authorization": "Bearer " + cfg.token,
      "Accept": "application/vnd.github+json"
    };
    if (!raw) headers["Content-Type"] = "application/json";
    return fetch(API + path, {
      method: method, headers: headers,
      body: body == null ? undefined : (raw ? body : JSON.stringify(body))
    }).then(function (r) {
      if (r.status === 401) throw new Error("Token 无效或已过期（401）");
      if (r.status === 403 && r.headers.get("X-RateLimit-Remaining") === "0") throw new Error("GitHub API 限流，请稍后再试（403）");
      if (r.status === 404) return { notFound: true, status: 404 };
      if (r.status >= 400) return r.json().catch(function () { return {}; }).then(function (j) {
        throw new Error("GitHub 错误 " + r.status + ": " + (j.message || ""));
      });
      return raw ? r.arrayBuffer() : r.json();
    });
  }

  /* ---------- 加密 ---------- */
  function deriveKey(pass) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        // 盐固定派生（同一密码总能解同一文件）；强度依赖密码本身
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: enc.encode("novel-notes-salt-v1"), iterations: 150000, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
      });
  }
  function ensureKey() {
    if (cryptoKey) return Promise.resolve(cryptoKey);
    var pass = sessionStorage.getItem("gh_pass");
    if (!pass) return Promise.reject(new Error("NEED_PASS"));
    return deriveKey(pass).then(function (k) { cryptoKey = k; return k; });
  }
  function encryptBytes(data) { // ArrayBuffer -> ArrayBuffer(iv+ct)
    return ensureKey().then(function (k) {
      var iv = crypto.getRandomValues(new Uint8Array(12));
      return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, k, data)
        .then(function (ct) {
          var out = new Uint8Array(12 + ct.byteLength);
          out.set(iv); out.set(new Uint8Array(ct), 12);
          return out.buffer;
        });
    });
  }
  function decryptBytes(data) { // ArrayBuffer -> ArrayBuffer
    return ensureKey().then(function (k) {
      var u = new Uint8Array(data);
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, k, u.slice(12));
    });
  }
  function encText(str) {
    var bytes = new TextEncoder().encode(str);
    return ensureKey().then(function () { return encryptBytes(bytes.buffer); })
      .then(function (buf) { return bufToB64(buf); });
  }
  function decText(b64) {
    var buf = b64ToBuf(b64);
    return decryptBytes(buf).then(function (plain) {
      return new TextDecoder().decode(plain);
    });
  }
  function bufToB64(buf) {
    var u = new Uint8Array(buf), s = "";
    for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function b64ToBuf(b64) {
    var bin = atob(b64), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u.buffer;
  }

  /* ---------- 仓库文件读写 ---------- */
  function getFile(path) {
    return ghReq("GET", "/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" + path)
      .then(function (j) {
        if (j.notFound) return null;
        return { sha: j.sha, content: j.content, encoding: j.encoding, size: j.size };
      });
  }
  function putFile(path, contentB64, sha, message) {
    return ghReq("PUT", "/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" + path, {
      message: message || "更新笔记", content: contentB64, sha: sha || undefined
    });
  }
  function deleteFile(path, sha) {
    return ghReq("DELETE", "/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" + path,
      { message: "删除图片", sha: sha });
  }

  /* ---------- 对外：配置向导 ---------- */
  function checkToken(token) {
    return fetch(API + "/user", { headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" } })
      .then(function (r) {
        if (r.status === 401) throw new Error("Token 无效（401），请检查是否复制完整");
        if (r.status === 403) throw new Error("Token 权限不足或被限流（403）");
        if (!r.ok) throw new Error("GitHub 返回 " + r.status);
        return r.json();
      })
      .then(function (u) { return { login: u.login }; });
  }
  function repoExists(token, owner, repo) {
    return fetch(API + "/repos/" + owner + "/" + repo, {
      headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" }
    }).then(function (r) { return r.ok; }).catch(function () { return false; });
  }
  function createDataRepo(token, login, name) {
    return fetch(API + "/user/repos", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json", "Accept": "application/vnd.github+json" },
      body: JSON.stringify({ name: name, private: true, description: "小说笔记工作台数据（自动同步）", auto_init: true })
    }).then(function (r) {
      if (r.ok) return r.json();
      // 403=Token 无创建权限 / 422=已存在：检查仓库是否已存在，存在就继续用
      return repoExists(token, login, name).then(function (ok) {
        if (ok) return null;
        throw new Error("无法自动创建仓库（" + r.status + "）。请先在 GitHub 网页上手动创建私有仓库：" +
          login + "/" + name + "（New repository → 勾选 Private），然后回来重试。");
      });
    });
  }
  function setPass(pass) {
    sessionStorage.setItem("gh_pass", pass);
    cryptoKey = null;
    return deriveKey(pass);
  }

  /* ---------- 对外：数据读写 ---------- */
  function load() {
    if (!cfg) return Promise.reject(new Error("NO_CFG"));
    if (isLocal()) {
      var d = lsGet(LS_LOCAL, null);
      if (d) { stateCache = d; lastSyncVersion = d.version || 0; }
      return Promise.resolve(d);
    }
    return getFile("data/notes.json").then(function (f) {
      if (!f) return null; // 空仓库
      lastSyncSha = f.sha;
      var raw = atob(f.content.replace(/\n/g, ""));
      var bytes = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      var parse = function (txt) {
        var d = JSON.parse(txt);
        lastSyncVersion = d.version || 0;
        stateCache = d;
        return d;
      };
      if (cfg.enc) {
        return decText(f.content.replace(/\n/g, "")).then(parse).catch(function () {
          throw new Error("DECRYPT_FAIL");
        });
      }
      return parse(new TextDecoder().decode(bytes));
    });
  }

  /* 合并策略：以本地为基础，融合远端较新的卡片；lanes 取本地顺序 + 远端新增 id */
  function mergeStates(local, remote) {
    if (!remote) return local;
    if (JSON.stringify(remote) === JSON.stringify(local)) return local;
    var map = {};
    (local.cards || []).forEach(function (c) { map[c.id] = c; });
    (remote.cards || []).forEach(function (c) {
      if (!map[c.id] || (c.updated || 0) > (map[c.id].updated || 0)) map[c.id] = c;
    });
    var merged = Object.assign({}, local);
    merged.cards = Object.keys(map).map(function (k) { return map[k]; });
    // lanes：本地顺序为准，补入远端多出的泳道与卡片
    (local.projects || []).forEach(function (b) {
      var rb = (remote.projects || []).filter(function (x) { return x.id === b.id; })[0];
      if (!rb || !rb.lanes) return;
      b.lanes = b.lanes || [];
      rb.lanes.forEach(function (rl) {
        var ll = b.lanes.filter(function (x) { return x.id === rl.id; })[0];
        if (!ll) { b.lanes.push(rl); return; }
        (rl.cards || []).forEach(function (cid) {
          if (ll.cards.indexOf(cid) < 0 && map[cid]) ll.cards.push(cid); // 远端有、本地没有的挂载
        });
      });
    });
    merged.projects = local.projects;
    merged.version = Math.max(local.version || 0, remote.version || 0) + 1;
    return merged;
  }

  function save(state) {
    if (!cfg) return Promise.reject(new Error("NO_CFG"));
    state.version = (state.version || 0) + 1;
    state.lastSaved = new Date().toISOString();
    if (isLocal()) return saveLocal(state);
    var payload = JSON.stringify(state, null, 1);
    var prep = cfg.enc ? encText(payload) : Promise.resolve(btoa(unescape(encodeURIComponent(payload))));
    return prep.then(function (b64) {
      // 先取远端最新，做合并防覆盖（手机/电脑互同步的关键）
      return getFile("data/notes.json").then(function (remoteFile) {
        var putIt = function (mergedB64, sha) {
          return putFile("data/notes.json", mergedB64, sha, "同步笔记 " + new Date().toLocaleString("zh-CN"))
            .then(function () { lastSyncSha = sha; stateCache = state; });
        };
        if (!remoteFile) return putIt(b64, null);
        if (remoteFile.sha === lastSyncSha) return putIt(b64, remoteFile.sha);
        // 远端有更新：拉下来合并
        var remoteRaw = atob(remoteFile.content.replace(/\n/g, ""));
        var bytes = new Uint8Array(remoteRaw.length);
        for (var i = 0; i < remoteRaw.length; i++) bytes[i] = remoteRaw.charCodeAt(i);
        var parseRemote = cfg.enc ? function () { return decText(remoteFile.content.replace(/\n/g, "")); }
          : function () { return Promise.resolve(new TextDecoder().decode(bytes)); };
        return parseRemote().then(function (txt) {
          var remote = JSON.parse(txt);
          var merged = mergeStates(state, remote);
          var mp = JSON.stringify(merged, null, 1);
          var mb = cfg.enc ? encText(mp) : Promise.resolve(btoa(unescape(encodeURIComponent(mp))));
          return mb.then(function (m64) { return putIt(m64, remoteFile.sha); });
        });
      });
    });
  }

  function saveLocal(state) {
    stateCache = state;
    try {
      localStorage.setItem(LS_LOCAL, JSON.stringify(state));
    } catch (e) {
      throw new Error("本机存储空间不足（约 5MB），请删掉一些图片或改用 GitHub 存储");
    }
    return Promise.resolve();
  }

  /* 强制覆盖远端（用于密码重置）：只取 sha，不解析远端内容 */
  function forceSave(state) {
    if (!cfg) return Promise.reject(new Error("NO_CFG"));
    state.version = (state.version || 0) + 1;
    state.lastSaved = new Date().toISOString();
    if (isLocal()) return saveLocal(state);
    var payload = JSON.stringify(state, null, 1);
    var prep = cfg.enc ? encText(payload) : Promise.resolve(btoa(unescape(encodeURIComponent(payload))));
    return prep.then(function (b64) {
      return getFile("data/notes.json").then(function (f) {
        return putFile("data/notes.json", b64, f ? f.sha : null, "重置加密密码（覆盖远端数据）")
          .then(function () { lastSyncSha = f ? f.sha : null; stateCache = state; });
      });
    });
  }

  /* ---------- 图片 ---------- */
  /* 本机模式：压缩后转成内嵌 dataURL（压缩到最长边 1400px，JPEG 0.85） */
  function fileToDataURL(file) {
    return file.arrayBuffer().then(function (buf) {
      var blob = new Blob([buf], { type: file.type || "image/png" });
      var url = URL.createObjectURL(blob);
      return new Promise(function (resolve) {
        var img = new Image();
        img.onload = function () {
          var max = 1400, w = img.width || 1, h = img.height || 1;
          if (w > max || h > max) { var r = Math.min(max / w, max / h); w = Math.max(1, Math.round(w * r)); h = Math.max(1, Math.round(h * r)); }
          try {
            var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
            cv.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(cv.toDataURL("image/jpeg", 0.85));
          } catch (e) { resolve(null); }
          URL.revokeObjectURL(url);
        };
        img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
      });
    });
  }
  function putImage(file) {
    if (isLocal()) {
      return fileToDataURL(file).then(function (durl) {
        if (!durl) throw new Error("图片读取失败");
        try {
          var prev = JSON.stringify(stateCache || null);
          if (prev && prev.length + durl.length > 4.6 * 1024 * 1024)
            throw new Error("本机存储空间不足（约 5MB），请删掉一些图片或改用 GitHub 存储");
        } catch (e) { if (e instanceof Error) throw e; }
        return durl;
      });
    }
    return file.arrayBuffer().then(function (buf) {
      var store = cfg.enc ? encryptBytes(buf) : Promise.resolve(buf);
      return store.then(function (enc) {
        var hash = "";
        var u = new Uint8Array(buf); // 用内容 hash 前若干位做文件名
        for (var i = 0; i < 8; i++) hash += ("0" + u[i * 7 % u.length].toString(16)).slice(-2);
        hash = Date.now().toString(36) + hash;
        var b64 = bufToB64(enc);
        var path = "images/" + hash + ".bin";
        return putFile(path, b64, null, "添加图片").then(function () {
          var url = URL.createObjectURL(new Blob([buf], { type: file.type || "image/png" }));
          imgCache[path] = url;
          return path;
        });
      });
    });
  }
  function imageURL(key) {
    if (!key) return Promise.resolve(null);
    if (/^data:/.test(key)) return Promise.resolve(key);   // 本机模式：图片直接内嵌
    if (imgCache[key]) return Promise.resolve(imgCache[key]);
    return getFile(key).then(function (f) {
      if (!f) return null;
      var bin = atob(f.content.replace(/\n/g, ""));
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var done = cfg.enc ? decryptBytes(bytes.buffer) : Promise.resolve(bytes.buffer);
      return done.then(function (plain) {
        var url = URL.createObjectURL(new Blob([plain], { type: "image/png" }));
        imgCache[key] = url;
        return url;
      });
    });
  }
  /* 渲染后把 data-key 的占位 img 填上真实内容 */
  function hydrate(scope) {
    (scope || document).querySelectorAll("img[data-key]").forEach(function (el) {
      if (el.__hydrated) return;
      el.__hydrated = true;
      var k = el.getAttribute("data-key");
      imageURL(k).then(function (url) {
        if (url) el.src = url;
        else el.style.display = "none";
      }).catch(function () { el.style.display = "none"; });
    });
  }

  /* ---------- 导出 / 导入 ---------- */
  function exportAll(state) {
    // 打包为自包含 JSON（图片转 base64 明文）
    var jobs = [];
    var imgs = {};
    Object.keys(state).forEach(function () {});
    (state.cards || []).forEach(function (c) {
      (c.images || []).forEach(function (k) {
        if (!imgs[k]) {
          imgs[k] = true;
          jobs.push(imageURL(k).then(function (url) {
            if (!url) return null;
            if (/^data:/.test(url)) return { key: k, b64: url.split(",")[1] || "" };
            return fetch(url).then(function (r) { return r.arrayBuffer(); }).then(function (b) {
              return { key: k, b64: bufToB64(b) };
            });
          }).catch(function () { return null; }));
        }
      });
    });
    return Promise.all(jobs).then(function (arr) {
      var payload = { type: "novel-notes-backup", version: 2, exported: new Date().toISOString(), state: state, images: arr.filter(Boolean) };
      var blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
      return blob;
    });
  }
  function importAll(payload) {
    if (!payload || payload.type !== "novel-notes-backup" || !payload.state) throw new Error("备份文件格式不对");
    var imgMap = {};
    var jobs = (payload.images || []).map(function (im) {
      if (!im || !im.key) return Promise.resolve();
      if (/^data:/.test(im.key)) { imgMap[im.key] = im.key; return Promise.resolve(); } // 本机模式：本身就是内嵌图
      return putImage(new Blob([b64ToBuf(im.b64)], { type: "image/png" })).then(function (k) {
        imgMap[im.key] = k;
      }).catch(function () {});
    });
    function b64ToBuf2(b64) { return b64ToBuf(b64); }
    return Promise.all(jobs).then(function () {
      var st = payload.state;
      st.cards.forEach(function (c) {
        c.images = (c.images || []).map(function (k) { return imgMap[k] || k; });
      });
      return st;
    });
  }

  return {
    loadCfg: loadCfg, saveCfg: saveCfg, checkToken: checkToken, createDataRepo: createDataRepo,
    isLocal: isLocal, useLocal: useLocal,
    setPass: setPass, ensureKey: ensureKey, hasPass: function () { return !!sessionStorage.getItem("gh_pass"); },
    load: load, save: save, forceSave: forceSave, putImage: putImage, imageURL: imageURL, hydrate: hydrate,
    exportAll: exportAll, importAll: importAll,
    stateCache: function () { return stateCache; }
  };
})();

</script>
<script>
/* 小说笔记工作台 · 前端 */
"use strict";
var APP_VERSION = "v1.4.0";
var APP_DATE = "2026-10-25";

var $ = function (id) { return document.getElementById(id); };
var state = null;          // {projects, cards, settings}
var curBookId = "";        // 当前书本
var curCat = "all";        // 当前分类筛选
var view = "wall";         // wall | timeline | graph
var searchText = "";
var editingCard = null;    // 编辑中的卡片（null=新建）
var editorPresetLane = null; // 从时间线泳道发起新建时，保存后自动放入该泳道
var draftImgs = [];        // 编辑器里待保存的图片
var draftLinks = [];       // 编辑器里待保存的关联
var pickedCat = "other";

/* ============ 常量 ============ */
var CAT_META = {
  person: { name: "人物",   color: "#e17055", em: "👤" },
  clue:   { name: "线索",   color: "#0984e3", em: "🔍" },
  time:   { name: "时间线", color: "#00b894", em: "⏱️" },
  place:  { name: "地点",   color: "#e84393", em: "📍" },
  quote:  { name: "摘抄",   color: "#fdcb6e", em: "✏️" },
  q:      { name: "疑问",   color: "#a29bfe", em: "❓" },
  other:  { name: "其他",   color: "#b2bec3", em: "📎" }
};
var CAT_ORDER = ["person", "clue", "time", "place", "quote", "q", "other"];
var DEFAULT_SETTINGS = { categories: JSON.parse(JSON.stringify(CAT_ORDER)) };

/* ============ 工具 ============ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function toast(msg, ms) {
  var el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  $("toastWrap").appendChild(el);
  setTimeout(function () { el.remove(); }, ms || 1800);
}
function catMeta(id) { return CAT_META[id] || CAT_META.other; }
function curBook() {
  for (var i = 0; i < state.projects.length; i++)
    if (state.projects[i].id === curBookId) return state.projects[i];
  return null;
}
function cardsOfBook(bid) {
  return state.cards.filter(function (c) { return c.bookId === bid; });
}
function cardById(id) {
  for (var i = 0; i < state.cards.length; i++) if (state.cards[i].id === id) return state.cards[i];
  return null;
}

/* ============ 数据同步（GitHub 版，含离线快照） ============ */
var offlineMode = false;
var LS_KEY = "nn_state_cache";

function applyState(d, fromCache) {
  state = d;
  state.projects = state.projects || [];
  state.cards = state.cards || [];
  state.settings = Object.assign({}, DEFAULT_SETTINGS, state.settings || {});
  normLinks(state);            // 兼容旧数据：把字符串 id 升级成 {id, note}
  if (!state.projects.length) {
    state.projects.push({ id: uid(), name: "我的第一本书", em: "📕", created: Date.now() });
  }
  if (!curBookId || !curBook()) curBookId = state.projects[0].id;
  offlineMode = !!fromCache;
  var bar = $("offlineBar");
  if (bar) bar.classList.toggle("hidden", !offlineMode);
  document.body.classList.toggle("is-offline", offlineMode);
  renderAll();
}
function loadState() {
  if (!Store.loadCfg()) { openSetup(); return; }
  Store.load().then(function (d) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(d || { projects: [], cards: [] })); } catch (e) {}
    applyState(d || { projects: [], cards: [], settings: {} }, false);
    if (d && (d.cards || []).length) toast(Store.isLocal() ? "已载入本机数据 ✓" : "已从 GitHub 同步 ✓");
  }).catch(function (err) {
    if (err && err.message === "NEED_PASS") { askPassword(function () { loadState(); }); return; }
    if (err && err.message === "DECRYPT_FAIL") { openDecryptError(); return; }
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) {}
    if (cached) { applyState(cached, true); toast("离线中，显示本地缓存（只读）"); }
    else { toast("加载失败：" + (err.message || err)); openSetup(); }
  });
}
function openDecryptError() {
  var s = $("sheet");

/* ---------- 关联卡片：结构兼容 + 工具函数 ----------
 * 旧数据：links = ["id1", "id2"]
 * 新数据：links = [{ id: "id1", note: "父子" }]
 */
function linkId(l) { return typeof l === "string" ? l : (l && l.id); }
function linkNote(l) { return (l && typeof l === "object" && l.note) || ""; }
function normLinks(d) {
  (d.cards || []).forEach(function (c) {
    c.links = (c.links || []).map(function (l) {
      return { id: linkId(l), note: linkNote(l) };
    }).filter(function (l) { return !!l.id; });
  });
}
function setLink(card, id, note) {
  card.links = card.links || [];
  var f = card.links.filter(function (l) { return linkId(l) === id; })[0];
  if (f) { if (note != null) f.note = note; }
  else card.links.push({ id: id, note: note || "" });
}
function removeLink(card, id) {
  card.links = (card.links || []).filter(function (l) { return linkId(l) !== id; });
}
/* 两个方向任一方向写了备注都算这条关系的备注 */
function pairNote(a, b) {
  var n = "";
  (a.links || []).forEach(function (l) { if (linkId(l) === b.id && linkNote(l)) n = linkNote(l); });
  if (!n) (b.links || []).forEach(function (l) { if (linkId(l) === a.id && linkNote(l)) n = linkNote(l); });
  return n;
}

function chipHtml(cid, name, n) {

function filteredCards() {
  var list = cardsOfBook(curBookId);
  if (curCat !== "all") list = list.filter(function (c) { return c.cat === curCat; });
  if (searchText) {
    var k = searchText.toLowerCase();
    list = list.filter(function (c) {
      return (c.title || "").toLowerCase().indexOf(k) >= 0 ||
             (c.content || "").toLowerCase().indexOf(k) >= 0 ||
             (c.tags || []).join(" ").toLowerCase().indexOf(k) >= 0;
    });
  }
  list.sort(function (a, b) {
    if (!!b.pinned !== !!a.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
    return (b.updated || 0) - (a.updated || 0);
  });
  return list;
}

/* ---- 时间线看板（手动拖拽） ---- */
function laneOf(cardId) {
  var b = curBook();
  if (!b || !b.lanes) return null;
  for (var i = 0; i < b.lanes.length; i++)
    if ((b.lanes[i].cards || []).indexOf(cardId) >= 0) return b.lanes[i];
  return null;
}
function laneClean(lane) {
  // 清理已不存在的卡片
  lane.cards = (lane.cards || []).filter(function (id) { return cardById(id); });
}
function timelineData() {
  var b = curBook();
  b.lanes = b.lanes || [];
  b.lanes.forEach(laneClean);
  var placed = {};
  b.lanes.forEach(function (l) { l.cards.forEach(function (id) { placed[id] = 1; }); });
  var pool = cardsOfBook(curBookId).filter(function (c) { return !placed[c.id]; });
  return { book: b, lanes: b.lanes, pool: pool };
}
function moveCardToLane(cardId, laneId, index) {
  var d = timelineData();
  var target = laneId === "__pool__" ? null : d.lanes.filter(function (l) { return l.id === laneId; })[0];
  // 从原处移除
  d.lanes.forEach(function (l) { l.cards = l.cards.filter(function (x) { return x !== cardId; }); });
  var card = cardById(cardId);
  if (card) card.updated = Date.now();
  if (target) {
    if (index == null || index < 0 || index > target.cards.length) index = target.cards.length;
    target.cards.splice(index, 0, cardId);
  }
  saveState(); renderTimeline();
}

function renderTimeline() {
  var el = $("timeline");
  var d = timelineData();
  var html = '<div class="tl-tip">⏱️ 时间线看板（手动整理）· 从左侧「待放置」拖卡片到泳道 · 泳道可 ✎ 重命名 / 🗑 删除 / ←→ 调序 · 手机端点卡片选「移动」</div>' +
    '<div class="kb-scroll"><div class="kb-track" id="kbTrack">';
  // 待放置池
  html += laneHtml({ id: "__pool__", title: "📥 待放置", cards: d.pool.map(function (c) { return c.id; }), pool: true });
  d.lanes.forEach(function (l) { html += laneHtml(l); });
  html += '<div class="kb-addlane" id="kbAddLane"><div>＋<br>新建<br>泳道</div></div>' +
    "</div></div>";
  el.innerHTML = html;
  bindTimelineEvents();
  Store.hydrate(el);
}

function laneHtml(lane) {
  var html = '<div class="kb-lane" data-lane="' + lane.id + '">' +
    '<div class="kb-lane-h">';
  if (lane.pool) {
    html += '<b class="kb-title">' + lane.title + ' <span class="n">' + lane.cards.length + "</span></b>";
  } else {
    html += '<b class="kb-title" data-rename="' + lane.id + '" title="点击重命名">' + esc(lane.title) +
      ' <span class="n">' + lane.cards.length + "</span></b>" +
      '<span class="kb-lane-ops">' +
      '<button data-lmove="-1" title="左移">←</button>' +
      '<button data-lmove="1" title="右移">→</button>' +
      '<button data-ladd="' + lane.id + '" title="在此泳道新建卡片">＋</button>' +
      '<button data-ldel="' + lane.id + '" title="删除泳道（卡片回到待放置）">🗑</button></span>';
  }
  html += "</div>" +
    '<div class="kb-drop" data-drop="' + lane.id + '">';
  lane.cards.forEach(function (id) {
    var c = cardById(id); if (!c) return;
    var m = catMeta(c.cat);
    html += '<div class="card kb-card" draggable="true" data-id="' + c.id + '" data-lane="' + lane.id + '" style="border-top-color:' + m.color + '">' +
      '<div class="c-head"><div class="c-title">' + esc(c.title || "（无标题）") + "</div>" +
      '<span class="c-cat" style="background:' + m.color + '">' + m.name + "</span></div>" +
      (c.content ? '<div class="c-body" style="-webkit-line-clamp:3">' + esc(c.content) + "</div>" : "") +
      ((c.images || []).length ? '<div class="c-imgs">' + c.images.slice(0, 2).map(function (u) {
        return '<img data-key="' + esc(u) + '" alt="">';
      }).join("") + "</div>" : "") +
      "</div>";
  });
  if (!lane.cards.length)
    html += '<div class="kb-empty">' + (lane.pool ? "新建的卡片先落在这里" : "拖卡片到这里") + "</div>";
  html += "</div></div>";
  return html;
}

function bindTimelineEvents() {
  var el = $("timeline");
  var dragId = null;
  el.querySelectorAll(".kb-card").forEach(function (c) {
    c.addEventListener("dragstart", function (e) {
      dragId = c.getAttribute("data-id");
      e.dataTransfer.setData("text/plain", dragId);
      c.classList.add("dragging");
    });
    c.addEventListener("dragend", function () { c.classList.remove("dragging"); });
    // 手机端：点按弹出操作
    c.addEventListener("click", function () { cardActions(c.getAttribute("data-id")); });
  });
  el.querySelectorAll("[data-drop]").forEach(function (zone) {
    zone.addEventListener("dragover", function (e) { e.preventDefault(); zone.classList.add("over"); });
    zone.addEventListener("dragleave", function () { zone.classList.remove("over"); });
    zone.addEventListener("drop", function (e) {
      e.preventDefault(); zone.classList.remove("over");
      var id = dragId || e.dataTransfer.getData("text/plain");
      if (!id) return;
      // 计算落点插入位置
      var lanes = Array.prototype.slice.call(zone.querySelectorAll(".kb-card:not(.dragging)"));
      var index = lanes.length;
      for (var i = 0; i < lanes.length; i++) {
        var r = lanes[i].getBoundingClientRect();
        if (e.clientX < r.left + r.width / 2 && lanes[i].getBoundingClientRect().top <= e.clientY + 40) { index = i; break; }
      }
      moveCardToLane(id, zone.getAttribute("data-drop"), index);
      dragId = null;
    });
  });
  el.querySelectorAll("[data-rename]").forEach(function (t) {
    t.addEventListener("click", function () {
      var d = timelineData();
      var lane = d.lanes.filter(function (l) { return l.id === t.getAttribute("data-rename"); })[0];
      var v = prompt("泳道名称（如：第1章 · 案发 / 1990年冬）：", lane.title);
      if (v && v.trim()) { lane.title = v.trim(); saveState(); renderTimeline(); }
    });
  });
  el.querySelectorAll("[data-ldel]").forEach(function (b) {
    b.addEventListener("click", function () {
      if (!confirm("删除该泳道？泳道里的卡片会回到「待放置」，不会丢。")) return;
      var d = timelineData();
      d.book.lanes = d.lanes.filter(function (l) { return l.id !== b.getAttribute("data-ldel"); });
      saveState(); renderTimeline();
    });
  });
  el.querySelectorAll("[data-lmove]").forEach(function (b) {
    b.addEventListener("click", function () {
      var dir = +b.getAttribute("data-lmove");
      var laneEl = b.closest(".kb-lane");
      var d = timelineData();
      var i = d.lanes.indexOf(d.lanes.filter(function (l) { return l.id === laneEl.getAttribute("data-lane"); })[0]);
      var j = i + dir;
      if (j < 0 || j >= d.lanes.length) return;
      var tmp = d.lanes[i]; d.lanes[i] = d.lanes[j]; d.lanes[j] = tmp;
      saveState(); renderTimeline();
    });
  });
  el.querySelectorAll("[data-ladd]").forEach(function (b) {
    b.addEventListener("click", function () { openEditor(null, b.getAttribute("data-ladd")); });
  });
  var add = $("kbAddLane");
  if (add) add.addEventListener("click", function () {
    var v = prompt("新泳道名称（如：第1章 · 案发）：");
    if (!v || !v.trim()) return;
    var d = timelineData();
    d.book.lanes.push({ id: uid(), title: v.trim(), cards: [] });
    saveState(); renderTimeline();
    toast("泳道已添加，拖卡片进去吧");
  });
}

  }

    html += '<div class="card" data-id="' + c.id + '" style="border-top-color:' + m.color + '">' +

  });

}
function fmtTime(t) {
  if (!t) return "";
  var d = new Date(t);
  var now = new Date();
  if (d.toDateString() === now.toDateString())
    return "今天 " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  return (d.getMonth() + 1) + "/" + d.getDate();
}

/* ---- 人物关系图（圆形布局 SVG）---- */
function renderGraph() {
  var g = $("graph");
  var nodes = cardsOfBook(curBookId);
  var withLinks = nodes.filter(function (c) { return (c.links || []).length > 0; });
  var set = {};
  withLinks.forEach(function (c) { set[c.id] = 1; });
  withLinks.forEach(function (c) {
    (c.links || []).forEach(function (l) {
      var lid = linkId(l);
      var t = cardById(lid);
      if (t && t.bookId === curBookId) set[lid] = 1;
    });
  });
  var ids = Object.keys(set).filter(function (id) { return cardById(id); });
  if (ids.length < 2) {
    g.innerHTML = '<div class="g-tip">🔗 关系图</div><div class="wall-empty"><b>还没有可展示的关系</b>在编辑卡片时添加「关联卡片」（双向关联），<br>比如把「凶手线索」关联到「某人物」，这里就会画出连线。</div>';
    return;
  }
  var W = Math.max(360, Math.min(900, window.innerWidth - 24));
  var H = Math.max(420, ids.length * 46);
  var cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 64;
  var pos = {};
  ids.forEach(function (id, i) {
    var a = -Math.PI / 2 + (2 * Math.PI * i) / ids.length;
    pos[id] = { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) };
  });
  var svg = '<svg class="g-svg" viewBox="0 0 ' + W + " " + H + '">';
  var drawn = {};
  ids.forEach(function (id) {
    var c = cardById(id);
    (c.links || []).forEach(function (l) {
      var lid = linkId(l);
      if (!pos[lid] || drawn[id + "|" + lid] || drawn[lid + "|" + id]) return;
      drawn[id + "|" + lid] = 1;
      svg += '<line x1="' + pos[id].x + '" y1="' + pos[id].y + '" x2="' + pos[lid].x + '" y2="' + pos[lid].y +
        '" stroke="#c9c4e8" stroke-width="2"/>';
      var note = pairNote(c, cardById(lid));
      if (note) {
        var mx = (pos[id].x + pos[lid].x) / 2, my = (pos[id].y + pos[lid].y) / 2;
        var wnote = esc(note.length > 10 ? note.slice(0, 10) + "…" : note);
        svg += '<text x="' + mx + '" y="' + (my - 3) + '" text-anchor="middle" font-size="11.5" font-weight="700"' +
          ' fill="#6b6288" stroke="#fff" stroke-width="3.5" paint-order="stroke">' + wnote + "</text>";
      }
    });
  });
  ids.forEach(function (id) {
    var c = cardById(id), m = catMeta(c.cat), p = pos[id];
    svg += '<g data-node="' + id + '" style="cursor:pointer">' +
      '<circle cx="' + p.x + '" cy="' + p.y + '" r="34" fill="' + m.color + '18" stroke="' + m.color + '" stroke-width="2"/>' +
      '<text x="' + p.x + '" y="' + (p.y + 5) + '" text-anchor="middle" font-size="17">' + m.em + "</text>" +
      '<text x="' + p.x + '" y="' + (p.y + 52) + '" text-anchor="middle" font-size="12.5" font-weight="700" fill="#241f33">' +
      esc((c.title || "").slice(0, 8) || "无标题") + "</text></g>";
  });
  svg += "</svg>";
  g.innerHTML = '<div class="g-tip">🔗 关系图（点击圆圈打开卡片 · 双指/滚轮缩放页面）</div>' + svg;
  g.querySelectorAll("[data-node]").forEach(function (el) {
    el.addEventListener("click", function () { openDetail(el.getAttribute("data-node")); });
  });
}

function uploadImage(file) {
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { toast("图片超过 8MB"); return; }
  toast("上传图片中…");
  Store.putImage(file).then(function (key) {
    draftImgs.push(key); renderEdImgs(); toast("图片已存入仓库 ✓");
  }).catch(function (e) { toast("上传失败：" + (e.message || e)); });
}

function saveCard() {
  var title = $("edTitle").value.trim();
  var content = $("edContent").value;
  if (!title && !content.trim() && !draftImgs.length) { toast("卡片是空的"); return; }
  var now = Date.now();
  var card = editingCard || { id: uid(), bookId: curBookId, created: now };
  card.title = title; card.content = content; card.cat = pickedCat;
  card.images = draftImgs; card.links = draftLinks.slice();
  card.pinned = $("edPin").value === "1";
  card.tags = $("edTags").value.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
  card.story = $("edStory").value.trim();
  card.updated = now;
  // 双向关联（备注两边同步）
  card.links.forEach(function (l) {
    var t = cardById(l.id);
    if (t) {
      setLink(t, card.id, l.note || "");
      t.updated = t.updated || now;
    }
  });
  state.cards.forEach(function (c) {
    if (c.id === card.id) return;
    var back = card.links.some(function (l) { return l.id === c.id; });
    var fwd = (c.links || []).some(function (l) { return linkId(l) === card.id; });
    if (fwd && !back) removeLink(c, card.id);
  });
  if (!editingCard) {
    state.cards.push(card);
    if (editorPresetLane) {
      var d = timelineData();
      var lane = d.lanes.filter(function (l) { return l.id === editorPresetLane; })[0];
      if (lane) { lane.cards = lane.cards || []; lane.cards.push(card.id); }
    }
  }
  editorPresetLane = null;
  saveState(); closeSheet(); renderAll(); toast("已保存 ✓");
}

  });
  $("mImport").addEventListener("click", function () {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        var payload;
        try { payload = JSON.parse(rd.result); } catch (e) { toast("文件不是备份 JSON"); return; }
        Store.importAll(payload).then(function (st) {
          return Store.forceSave(st).then(function () { loadState(); toast("已导入 ✓"); });
        }).catch(function (e) { toast("导入失败：" + (e.message || e)); });
      };
      rd.readAsText(f);
    };
    inp.click();
  });
  $("mStore").addEventListener("click", openSetup);
  $("mCat").addEventListener("click", openCatManager);
}
function openCatManager() {
  var s = $("sheet");
  var used = {};
  cardsOfBook(curBookId).forEach(function (c) { used[c.cat] = 1; });
  s.innerHTML = '<div class="grab"></div><h3>分类管理</h3>' +
    '<div class="pick-list">' + state.settings.categories.map(function (cid) {
      var m = catMeta(cid);
      var fixed = CAT_ORDER.indexOf(cid) >= 0;
      return '<div class="pick-item"><span class="dot" style="background:' + m.color + '"></span>' +
        '<span class="nm">' + m.em + " " + m.name + (used[cid] ? " · 有卡片" : "") + "</span>" +
        (fixed ? "" : '<button class="rm" data-rmcat="' + cid + '">移除</button>') + "</div>";
    }).join("") + "</div>" +
    '<div class="f-row" style="margin-top:12px"><label>新增分类</label>' +
    '<div style="display:flex;gap:8px"><input type="text" id="newCatName" placeholder="分类名，如：作案手法" style="flex:1">' +
    '<button class="mini-btn primary" id="addCat" style="flex:none">添加</button></div></div>' +
    '<div class="sheet-ops"><button class="btn-ghost" id="cmBack">返回</button></div>';
  s.querySelectorAll("[data-rmcat]").forEach(function (b) {
    b.addEventListener("click", function () {
      var cid = b.getAttribute("data-rmcat");
      state.settings.categories = state.settings.categories.filter(function (x) { return x !== cid; });
      saveState(); openCatManager(); renderCats();
    });
  });
  $("addCat").addEventListener("click", function () {
    var name = $("newCatName").value.trim();
    if (!name) return;
    var key = "c_" + uid();
    CAT_META[key] = { name: name, color: hslColor(state.settings.categories.length), em: "🏷" };
    state.settings.categories.push(key);
    saveState(); openCatManager(); renderCats(); toast("已添加");
  });
  $("cmBack").addEventListener("click", openMenu);
}
function hslColor(i) {
  return "hsl(" + ((i * 67) % 360) + ",62%,55%)";
}

/* ============ 书本管理 ============ */
function newBookPrompt() {
  var name = prompt("书名（如：白夜行）：");
  if (!name || !name.trim()) return;
  var ems = ["📕", "📗", "📘", "📙", "📓", "🔍", "🕵️", "🌃"];
  state.projects.push({ id: uid(), name: name.trim(), em: ems[state.projects.length % ems.length], created: Date.now() });
  curBookId = state.projects[state.projects.length - 1].id;
  curCat = "all";
  saveState(); renderAll();
  toast("已创建，开始记卡片吧");
}

/* ============ 事件绑定 ============ */
function closeSheet() {
  $("sheet").classList.add("hidden");
  $("sheetBackdrop").classList.add("hidden");
}
$("sheetBackdrop").addEventListener("click", closeSheet);
$("drawerBackdrop").addEventListener("click", function () {
  $("bookDrawer").classList.add("hidden");
  $("drawerBackdrop").classList.add("hidden");
});
$("btnBooks").addEventListener("click", function () {
  $("bookDrawer").classList.remove("hidden");
  $("drawerBackdrop").classList.remove("hidden");
});
$("btnNewBook").addEventListener("click", newBookPrompt);
$("bookList").addEventListener("click", function (e) {
  var del = e.target.closest("[data-delb]");
  if (del) {
    var bid = del.getAttribute("data-delb");
    if (!confirm("删除这本书及其全部卡片？")) return;
    state.cards = state.cards.filter(function (c) { return c.bookId !== bid; });
    state.projects = state.projects.filter(function (b) { return b.id !== bid; });
    if (curBookId === bid) curBookId = state.projects[0] ? state.projects[0].id : "";
    saveState(); renderAll(); return;
  }
  var item = e.target.closest("[data-b]");
  if (item) {
    curBookId = item.getAttribute("data-b"); curCat = "all";
    $("bookDrawer").classList.add("hidden");
    $("drawerBackdrop").classList.add("hidden");
    renderAll();
  }
});
$("catBar").addEventListener("click", function (e) {
  var b = e.target.closest("[data-cat]"); if (!b) return;
  curCat = b.getAttribute("data-cat"); renderCats(); renderView();
});
$("fab").addEventListener("click", function () { openEditor(null); });
$("wall").addEventListener("click", function (e) {
  var c = e.target.closest("[data-id]");
  if (c) openDetail(c.getAttribute("data-id"));
});
$("btnSearch").addEventListener("click", function () {
  $("searchWrap").classList.toggle("hidden");
  if ($("searchWrap").classList.contains("hidden")) {
    searchText = ""; $("searchInput").value = ""; renderWall();
  } else $("searchInput").focus();
});
$("searchInput").addEventListener("input", function () {
  searchText = this.value.trim(); renderWall();
});
$("btnMenu").addEventListener("click", openMenu);
$("btnView").addEventListener("click", function () {
  view = view === "wall" ? "timeline" : (view === "timeline" ? "graph" : "wall");
  toast(view === "timeline" ? "时间线" : (view === "graph" ? "人物关系图" : "卡片墙"));
  renderView();
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") closeSheet();
});

/* ============ 弹层：居中 + 可拖动（仅电脑端） ============ */
(function sheetDrag() {
  var el = $("sheet");
  var desktop = function () { return window.matchMedia("(min-width:760px)").matches; };
  var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0, moved = false, lastTap = 0;

  function reset() {   // 回到默认居中
    el.style.left = ""; el.style.top = ""; el.style.transform = ""; el.style.bottom = "";
    try { sessionStorage.removeItem("nn_sheet_pos"); } catch (e) {}
  }
  function isGrip(t) {
    return t && (t.classList.contains("grab") || t.tagName === "H3");
  }
  function applyPos(x, y) {
    var r = el.getBoundingClientRect();
    var maxX = window.innerWidth - Math.min(r.width, 120) ;
    var minY = -(r.height - 90);            // 允许上半部分移出屏幕，跟普通窗口一致
    var maxY = window.innerHeight - 40;
    x = Math.max(-r.width + 120, Math.min(x, maxX));
    y = Math.max(minY, Math.min(y, maxY));
    el.style.bottom = "auto";
    el.style.transform = "none";
    el.style.left = x + "px";
    el.style.top = y + "px";
    try { sessionStorage.setItem("nn_sheet_pos", JSON.stringify({ x: x, y: y })); } catch (e) {}
  }
  el.addEventListener("pointerdown", function (e) {
    if (!desktop() || e.button !== 0) return;
    if (!isGrip(e.target)) return;
    // 自己判定双击（回正），因为 preventDefault 会屏蔽原生 dblclick
    var now = Date.now();
    if (now - lastTap < 420) {
      lastTap = 0; reset(); toast("已回到屏幕中间"); dragging = false;
      el.classList.remove("dragging");
      e.preventDefault(); return;
    }
    lastTap = now;
    var r = el.getBoundingClientRect();
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
    el.classList.add("dragging");
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  el.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    applyPos(ox + dx, oy + dy);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    el.classList.remove("dragging");
  }
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);
  window.addEventListener("resize", function () { if (!desktop()) reset(); });
  new MutationObserver(function () {
    if (el.classList.contains("hidden") || dragging) return;
    if (!desktop()) { el.style.left = ""; el.style.top = ""; el.style.transform = ""; el.style.bottom = ""; return; }
    var pos = null;
    try { pos = JSON.parse(sessionStorage.getItem("nn_sheet_pos") || "null"); } catch (e) {}
    if (pos && typeof pos.x === "number") {
      el.style.bottom = "auto"; el.style.transform = "none";
      el.style.left = pos.x + "px"; el.style.top = pos.y + "px";
    } else reset();
  }).observe(el, { attributes: true, attributeFilter: ["class"] });
  window.addEventListener("resize", function () { if (!desktop()) reset(); });
})();

/* ============ 启动 ============ */
loadState();

</script>
